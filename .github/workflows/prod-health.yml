name: Production health

# Verifies that the *auth path* actually works in production, not just that the
# web server answers. /healthz returns 200 even when Supabase is completely
# unreachable, which is how a seven-week signup/login outage went unnoticed.
#
# The check sends a deliberately-wrong password and asserts the API responds
# with Supabase's real rejection. That proves the whole chain is alive:
# Railway -> app -> Supabase Auth -> back again.
#
# It also renders the public proof page, because /healthz and the auth path
# both stayed green through an outage where every shared record returned 500.
# The HTML branch threw while ?format=json served the same record correctly,
# so nothing that only checked an API would ever have noticed.
#
# This workflow also keeps itself switched on. GitHub disables scheduled
# workflows after 60 days without repository activity, and any quiet stretch
# can reach that. The failure mode is nasty rather than merely annoying: this
# alarm would go quiet at roughly the same time as attention does, so an
# outage after that point is silent. A monthly heartbeat commit counts as
# activity and keeps the schedule alive with about 2x margin.
#
# The heartbeat runs BEFORE the health checks, deliberately. If it ran after,
# a genuine outage would fail the job before the heartbeat could commit, the
# repository would go inactive, and the alarm would disable itself precisely
# when it was the only thing still reporting a problem.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    name: Auth path reachable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Monthly heartbeat, so this alarm cannot disable itself
        run: |
          set -euo pipefail
          month=$(date -u +%Y-%m)
          file=.github/heartbeat.txt
          if [ -f "$file" ] && grep -q "^$month$" "$file"; then
            echo "Heartbeat for $month already recorded."
            exit 0
          fi
          printf '%s\n' "$month" > "$file"
          git config user.name  'darkmatter-health'
          git config user.email 'actions@github.com'
          git add "$file"
          git commit -m "chore: health heartbeat $month"
          git push
          echo "Heartbeat committed for $month."

      - name: Server responds
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 https://darkmatterhub.ai/healthz)
          echo "GET /healthz -> HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Server is down (/healthz returned $code)"; exit 1; }

      - name: Auth path reaches Supabase
        run: |
          # Random address each run so the per-email lockout in /auth/login
          # (5 failures / 15 min) can never mask a real outage behind a 429.
          probe="healthcheck-$(date +%s)-$RANDOM@example.invalid"
          body=$(curl -sS --max-time 30 -X POST \
            -H 'Content-Type: application/json' \
            --data "{\"email\":\"$probe\",\"password\":\"deliberately-wrong-password\"}" \
            https://darkmatterhub.ai/auth/login)

          echo "POST /auth/login -> $body"

          # The healthy answer is Supabase rejecting the credentials. Anything
          # else means the app could not complete a round trip to Supabase.
          case "$body" in
            *"Invalid login credentials"*)
              echo "OK: auth path is healthy end to end."
              ;;
            *"fetch failed"*)
              echo "::error::Supabase unreachable from the app (fetch failed). Likely a paused Supabase project or stale DNS in the Railway container - redeploy after restoring."
              exit 1
              ;;
            *"is not valid JSON"*)
              echo "::error::Supabase returned HTML instead of JSON. Project may be restoring, or SUPABASE_URL / API keys are wrong."
              exit 1
              ;;
            *)
              echo "::error::Unexpected response from /auth/login. Auth path may be broken."
              exit 1
              ;;
          esac

      - name: Public proof page renders
        run: |
          set -uo pipefail
          # The record the public demo advertises. If this stops rendering, the
          # product's central claim is broken for every visitor.
          id=ctx_1787544415723_bd78b91d9446

          code=$(curl -sS -o /tmp/proof.html -w '%{http_code}' --max-time 30 \
            "https://darkmatterhub.ai/r/$id")
          echo "GET /r/$id -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Public proof page returned $code. The demo's verify link is dead."
            exit 1
          fi

          # A 200 is not enough. The page once rendered "N steps" over an empty
          # body, and a 500 here was invisible to a JSON-only check because
          # ?format=json served the same record perfectly while the HTML branch
          # threw. So assert the page actually contains its verdict.
          if ! grep -q 'Record intact' /tmp/proof.html; then
            echo "::error::Proof page rendered without an intact verdict. Chain may be broken, or the renderer failed."
            exit 1
          fi

          # And that verification really ran, rather than the page asserting it.
          json=$(curl -sS --max-time 30 "https://darkmatterhub.ai/r/$id?format=json")
          echo "$json" | grep -q '"chain_intact":true' || {
            echo "::error::chain_intact is not true for the advertised demo record."; exit 1; }
          echo "$json" | grep -q '"payload_hash_verified":true' || {
            echo "::error::payload_hash did not verify for the advertised demo record."; exit 1; }
          echo "Public proof page renders and verifies."

      # Deliberately NO signup probe.
      #
      # Hitting /auth/signup creates a real row in auth.users on every run,
      # even with an undeliverable .invalid address. At this cadence that is
      # roughly 1,460 junk accounts a year, which would corrupt the signup
      # metrics this product needs to read accurately.
      #
      # The login probe above already covers the failure mode that matters:
      # both endpoints share the same Supabase client, so if signup cannot
      # reach Supabase, neither can login, and this job fails.
      #
      # SMTP delivery is genuinely not covered here. Watch that through the
      # email provider's own alerting instead.
