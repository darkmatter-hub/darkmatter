name: Daily X post

on:
  schedule:
    # Three daily slots (UTC). The script posts on only ONE of them per day,
    # rotating across days so the posting time varies. Keep these in sync with
    # SLOTS_UTC in scripts/daily-tweet.js.
    - cron: '15 13 * * *'   # ~9:15am ET
    - cron: '45 16 * * *'   # ~12:45pm ET
    - cron: '30 21 * * *'   # ~5:30pm ET
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab for testing.
    inputs:
      tweet_index:
        description: 'Optional: post a specific tweet by 0-based index (leave blank for the daily pick)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  tweet:
    name: Post daily tweet
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Post tweet
        env:
          X_API_KEY:             ${{ secrets.X_API_KEY }}
          X_API_SECRET:          ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:        ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          # Manual runs bypass the slot check and always post (for testing).
          FORCE_POST: ${{ github.event_name == 'workflow_dispatch' }}
          # Optional: post a specific tweet by index (manual runs only).
          TWEET_INDEX: ${{ github.event.inputs.tweet_index }}
        run: node scripts/daily-tweet.js

      # The ledger is the only thing preventing a repeat, so it has to outlive
      # the runner. Without this commit every run would start from an empty
      # ledger and cheerfully repost the whole bank, which is the failure this
      # was built to end.
      #
      # always(), because a run that posted and then failed later must still
      # record what went out. The alternative is a tweet that exists on X but
      # not in the ledger, which is exactly how it gets sent twice.
      - name: Record what was posted
        if: always()
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/posted-tweets.json; then
            echo "Nothing posted this run; ledger unchanged."
            exit 0
          fi
          git config user.name  'darkmatter-tweet'
          git config user.email 'actions@github.com'
          git add scripts/posted-tweets.json
          git commit -m "chore: record posted tweet"
          # Another run may have pushed between checkout and here.
          git pull --rebase --autostash origin main
          git push
          echo "Ledger updated."

