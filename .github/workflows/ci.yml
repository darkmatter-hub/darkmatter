name: DarkMatter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Run smoke tests
        run: node test/smoke.test.js

      - name: Check server.js syntax
        run: node --check src/server.js

      # Compares our hashing against values produced by the Python reference
      # SDK. Every other test here checks this codebase against itself, which
      # is how five write paths drifted away from the specification while
      # everything stayed green.
      - name: Conformance with the Context Passport specification
        run: node test/conformance.test.js

      # The published CC0 vector suite, the same one every other implementation
      # is graded on. Failing here means DarkMatter is wrong, never the vector.
      - name: Published conformance vector suite
        run: node test/conformance-suite.test.js

      # Catches claims that rot. A hardcoded "80 days to August 2" sat on the
      # EU AI Act page well past that date, beside a countdown that was
      # dynamic and correct. Blocking here is the only way a marketing page
      # gets the same scrutiny as code.
      - name: Audit public pages for stale claims
        run: node scripts/content-audit.js

      # The /verify page verified nothing for a long time: its checks tested
      # whether fields were present and it reported "no changes detected"
      # without hashing anything. This runs the shipped browser logic against
      # intact and tampered bundles, and cross-checks its RFC 8785
      # implementation against src/integrity.js.
      - name: The browser verifier actually verifies
        run: node test/verify_page.test.js

      # The verifier five public pages tell readers to download and run. It was
      # unserved and crashing on our own demo bundle for a long time, and
      # nothing noticed because nothing ran it. This runs it, against both
      # bundle shapes and against deliberately tampered copies of each.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the reference SDK for the cross-check
        run: pip install "context-passport>=2.0,<3.0"

      - name: The offline verifier actually verifies
        run: python test/verify_script.test.py

      - name: Check the tweet bank is sound
        run: node scripts/daily-tweet.js --check

      - name: Check no duplicate routes
        run: |
          COUNT=$(grep -c "app.get('/dashboard/commits'" src/server.js || true)
          if [ "$COUNT" -gt 1 ]; then
            echo "ERROR: Duplicate /dashboard/commits route ($COUNT found)"
            exit 1
          fi
          echo "Route check passed (count: $COUNT)"
